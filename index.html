<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudo</title>
<style>
:root{--bg:#12151a;--card:#1a1e26;--fg:#e6e9ee;--muted:#8b95a5;--ok:#3ddc84;--erro:#ff6b6b;--linha:#2b323d;--ac:#7aa2f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);padding:18px}
.topo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:19px}
.placar{color:var(--muted);font-size:13px}
.banco{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--linha);color:var(--muted)}
.banco.on{border-color:var(--ok);color:var(--ok)}
.trilhas{display:flex;gap:8px;margin-bottom:10px}
.trilha{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:5px 4px;cursor:pointer;font:inherit;font-size:14px}
.trilha.on{border-bottom-color:var(--ac);color:var(--fg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--card);border:1px solid var(--linha);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.tab.on{border-color:var(--ac);color:var(--fg)}
.tab.feito{border-color:var(--ok);color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.painel{background:var(--card);border:1px solid var(--linha);border-radius:8px;padding:14px}
h2{font-size:15px;margin-bottom:8px}
.alvo{color:var(--ac);font-size:12px;margin-bottom:10px}
p{margin-bottom:8px}
pre,code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
pre{background:#0d1016;border-left:2px solid var(--linha);padding:8px 10px;margin:8px 0;overflow-x:auto;white-space:pre-wrap}
.dica{color:var(--muted);font-size:13px;font-style:italic;margin-top:8px}
textarea{width:100%;min-height:120px;background:#0d1016;color:var(--fg);border:1px solid var(--linha);border-radius:6px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;resize:vertical}
textarea:focus{outline:none;border-color:var(--ac)}
.saida{margin-top:12px;padding:10px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap}
.saida.ok{background:rgba(61,220,132,.1);border:1px solid var(--ok);color:var(--ok)}
.saida.erro{background:rgba(255,107,107,.08);border:1px solid var(--erro);color:var(--erro)}
.saida.neutro{background:#0d1016;border:1px solid var(--linha);color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{background:var(--card);border:1px solid var(--linha);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--ac)}
button.principal{background:var(--ac);border-color:var(--ac);color:#0d1016;font-weight:600}
.hist{margin-top:14px;border-top:1px solid var(--linha);padding-top:10px}
.hist h3{font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.tent{font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:4px 0;border-bottom:1px solid #21262f;color:var(--muted)}
.tent b{color:var(--erro)} .tent b.v{color:var(--ok)}
.rodape{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
/* trilha Teoria: o gabarito so aparece DEPOIS de entregar (regra 1 do projeto) */
.gab{margin-top:12px;background:#0d1016;border:1px solid var(--linha);border-left:2px solid var(--ac);border-radius:6px;padding:12px}
.gab h3{font-size:12px;color:var(--ac);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px}
.gab p{margin-bottom:8px}
.cobertura{list-style:none;margin:0 0 12px;padding:0;font-size:13px}
.cobertura li{padding:3px 0;color:var(--muted)}
.cobertura li.sim{color:var(--ok)}
.cobertura li.nao{color:var(--erro)}
.nota{margin-top:12px;border-top:1px solid var(--linha);padding-top:10px}
.nota p{font-size:13px;color:var(--muted);margin-bottom:8px}
.nota .nav{margin-top:0}
</style></head><body>

<div class="topo">
  <h1>Estudo</h1>
  <span class="placar" id="placar">carregando compilador...</span>
  <span class="banco" id="banco">banco: nao</span>
</div>

<div class="trilhas">
  <button class="trilha on" data-t="ts">TypeScript</button>
  <button class="trilha" data-t="js">JavaScript</button>
  <button class="trilha" data-t="teoria">Teoria</button>
</div>

<div class="tabs" id="tabs"></div>
<div class="grid">
  <div class="painel" id="enunciado"></div>
  <div class="painel">
    <h2>Sua resposta</h2>
    <textarea id="editor" spellcheck="false" placeholder="escreve e clica em conferir. chuta em 15 segundos, feio serve."></textarea>
    <div class="nav">
      <button class="principal" id="conferir">conferir</button>
      <button id="anterior">anterior</button>
      <button id="proximo">proximo</button>
      <button id="limpar">limpar</button>
    </div>
    <div class="saida neutro" id="saida">escreve e clica em conferir. voce so ve o erro depois de entregar.</div>
    <div id="gabarito" class="gab" hidden></div>
    <div class="hist"><h3>tentativas neste exercicio</h3><div id="hist"></div></div>
  </div>
</div>

<div class="rodape">
  <button id="copiar">copiar historico</button>
  <button id="baixar">baixar json</button>
</div>

<script src="https://unpkg.com/typescript@5.9.3/lib/typescript.js"></script>
<script src="exercicios.js"></script>
<script src="app.js"></script>
</body></html>
